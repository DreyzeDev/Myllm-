model:
  vocab_size: 32000
  context_length: 1024
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  intermediate_size: 1408
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  processed_dir: data/processed/full_v1

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.00003
  min_learning_rate_ratio: 0.3
  weight_decay: 0.1
  warmup_steps: 0
  schedule_steps: 16000
  reset_scheduler_at_step: 16000
  max_steps: 32000
  gradient_clip_norm: 1.0
  save_interval: 1000
  evaluation_interval: 250
  evaluation_batches: 50
  validation_increase_patience: 4
  prompt_evaluation_interval: 2000
  prompt_evaluation_log: prompt_evaluations.jsonl
  prompt_evaluation_tokenizer: tokenizer/tokenizer.json
  prompt_max_new_tokens: 64
  prompt_temperature: 0.7
  prompt_top_k: 50
  prompt_top_p: 0.9
  prompt_repetition_penalty: 1.15
  prompt_seed: 42
  log_interval: 10
  num_workers: 0
  precision: auto
  seed: 42
  output_dir: checkpoints/v1-pretraining
