model:
  vocab_size: 32000
  context_length: 1024
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  intermediate_size: 1408
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true

tokenizer:
  vocab_size: 32000
  min_frequency: 2
  text_key: text

data:
  train_dir: data/raw
  processed_dir: data/processed
  validation_fraction: 0.01
  deduplicate: true
  seed: 42

training:
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0003
  min_learning_rate_ratio: 0.1
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 20000
  gradient_clip_norm: 1.0
  save_interval: 500
  evaluation_interval: 500
  evaluation_batches: 100
  log_interval: 10
  num_workers: 0
  precision: auto
  seed: 42
  output_dir: checkpoints

