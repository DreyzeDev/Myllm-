model:
  vocab_size: 32000
  context_length: 1024
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  intermediate_size: 1408
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  processed_dir: data/processed/full_v1

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.0003
  min_learning_rate_ratio: 0.1
  weight_decay: 0.1
  warmup_steps: 1
  max_steps: 3
  gradient_clip_norm: 1.0
  save_interval: 2
  evaluation_interval: 1
  evaluation_batches: 2
  log_interval: 1
  num_workers: 0
  precision: auto
  seed: 42
  output_dir: checkpoints/full-data-resume-v1
